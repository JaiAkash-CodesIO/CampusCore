<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="dashboard">

        <header class="dashboard-header">

            <div>
                <h1>Student Dashboard</h1>
                <p>Student Management System</p>
            </div>

            <button id="logoutButton" class="btn-logout">
                Logout
            </button>

        </header>

        <main class="dashboard-content">

            <div class="welcome-section">
                <h2 id="welcomeMessage">Welcome!</h2>
                <p>Here are your student details.</p>
            </div>

            <div id="loading" class="loading">
                Loading student details...
            </div>

            <div id="studentDetails" class="student-card">

                <div class="profile-section">
                    <div id="profileInitial" class="profile-avatar">
                        S
                    </div>

                    <div>
                        <h2 id="studentName">Student Name</h2>
                        <p id="studentEmail">student@email.com</p>
                    </div>
                </div>

                <div class="details-grid">

                    <div class="detail-item">
                        <span class="detail-label">Student ID</span>
                        <span id="studentId" class="detail-value">-</span>
                    </div>

                    <div class="detail-item">
                        <span class="detail-label">Department</span>
                        <span id="studentDepartment" class="detail-value">-</span>
                    </div>

                    <div class="detail-item">
                        <span class="detail-label">Year</span>
                        <span id="studentYear" class="detail-value">-</span>
                    </div>

                    <div class="detail-item">
                        <span class="detail-label">Email</span>
                        <span id="studentEmailDetails" class="detail-value">-</span>
                    </div>

                </div>

            </div>

            <div id="errorMessage" class="message error"></div>

        </main>

    </div>

    <script src="js/dashboard.js"></script>

</body>
</html>
